name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r site/. _site/
          cp docs/hero.gif docs/social-preview.png _site/docs/
          mkdir -p _site/docs/case _site/docs/cases/desert _site/docs/cases/cherry
          cp docs/case/thumb.jpg _site/docs/case/
          cp docs/cases/desert/thumb.jpg _site/docs/cases/desert/
          cp docs/cases/cherry/thumb.jpg _site/docs/cases/cherry/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
